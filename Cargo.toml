[package]
name = "mumbling-cockpit-standalone"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.6", features = ["codec"] }
futures = "0.3"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
openssl = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
url = "2.5"
libc = "0.2"
reqwest = { version = "0.12", features = ["json"] }
clap = { version = "4.0", features = ["derive"] }
nnnoiseless = "0.5"
webrtc-audio-processing = { version = "2.1", features = ["bundled"] }

# VoIP Stack
mumble-protocol = "0.4"
tokio-native-tls = "0.3"
native-tls = "0.2"
cpal = "0.15"
audiopus = { version = "0.3.0-rc.0" }
byteorder = "1.5"
bytes = "1.0"
