[package]
name = "mumbled-flight-plugin"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
mumbled-flight-core = { path = "../mumbled-flight-core" }
xplane-sys = { version = "4.0.109", features = ["XPLM200", "XPLM210", "XPLM300", "XPLM301"] }
tokio = { version = "1.0", features = ["full"] }
imgui = "0.12"
imgui-glow-renderer = "0.12"
glow = "0.13"
cpal = "0.15"
libc = "0.2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
