[package]
name = "mumbled-flight-plugin"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
mumbled-flight-core = { path = "../mumbled-flight-core" }
xplane-sys = { version = "4.0.109", features = ["XPLM200", "XPLM210"] }
tokio = { version = "1.0", features = ["full"] }
log = "0.4"
