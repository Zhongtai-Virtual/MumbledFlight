name: Build Plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            xpl_dir: lin_x64
            lib: libmumbled_flight_plugin.so
          - os: macos-26-intel # Intel
            xpl_dir: mac_x86_64
            lib: libmumbled_flight_plugin.dylib
          - os: macos-26 # ARM
            xpl_dir: mac_arm64
            lib: libmumbled_flight_plugin.dylib
          - os: windows-latest
            xpl_dir: win_x64
            lib: mumbled_flight_plugin.dll

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # ── Linux ──────────────────────────────────────────────────────────────
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libpulse-dev libssl-dev libopus-dev \
            libpipewire-0.3-dev clang pkg-config

      # ── macOS ──────────────────────────────────────────────────────────────
      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: brew install opus openssl@3

      - name: Set macOS pkg-config paths
        if: runner.os == 'macOS'
        run: |
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix opus)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Create X-Plane SDK framework stubs (macOS)
        if: runner.os == 'macOS'
        run: |
          # Build stub dylibs in /tmp (no sudo needed), then point the linker there with -F.
          # -undefined dynamic_lookup lets all XPLM symbols resolve when X-Plane loads the plugin.
          for fw in XPLM XPWidgets; do
            mkdir -p /tmp/XPlaneSDK/${fw}.framework
            printf 'void _stub(void){}' | \
              cc -x c - -dynamiclib -o /tmp/XPlaneSDK/${fw}.framework/${fw}
          done
          echo "RUSTFLAGS=-C link-arg=-F -C link-arg=/tmp/XPlaneSDK -C link-arg=-undefined -C link-arg=dynamic_lookup" >> "$GITHUB_ENV"

      # ── Windows ────────────────────────────────────────────────────────────
      - name: Install Windows system dependencies (vcpkg)
        if: runner.os == 'Windows'
        run: |
          vcpkg install openssl:x64-windows-static-md opus:x64-windows-static-md
          echo "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_PATH=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md/lib/pkgconfig" >> $env:GITHUB_ENV
          echo "VCPKGRS_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build
        run: cargo build --release -p mumbled-flight-plugin

      - name: Package .xpl
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.xpl_dir }}
          cp target/release/${{ matrix.lib }} dist/${{ matrix.xpl_dir }}/MumbledFlight.xpl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.xpl_dir }}
          path: dist/${{ matrix.xpl_dir }}/MumbledFlight.xpl

  # Combine all three platforms into MumbledFlight.zip
  # Extract into Resources/plugins/ to install.
  bundle:
    needs: build
    runs-on: macos-26
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble X-Plane Plugin Directory
        run: |
          mkdir -p staging/MumbledFlight/64
          
          # Combine macOS binaries into a Fat Binary (Universal 2)
          lipo -create \
            artifacts/mac_x86_64/MumbledFlight.xpl \
            artifacts/mac_arm64/MumbledFlight.xpl \
            -output staging/MumbledFlight/64/mac.xpl
            
          # Copy other platforms with standard names
          cp artifacts/lin_x64/MumbledFlight.xpl staging/MumbledFlight/64/lin.xpl
          cp artifacts/win_x64/MumbledFlight.xpl staging/MumbledFlight/64/win.xpl

      - name: Upload MumbledFlight Bundle
        uses: actions/upload-artifact@v4
        with:
          name: MumbledFlight
          path: staging/
